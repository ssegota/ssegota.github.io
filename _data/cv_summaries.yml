# Biography at five lengths, for conference programmes, speaker introductions,
# grant forms and similar. The front page shows one at a time behind the length
# switch; the `full` entry is also the Profile section of the generated PDF
# (scripts/build_cv_pdf.py).
#
# Markdown is allowed; institution names carry links (fipu.unipu.hr,
# daignostics.info, liberiq.com). `label` is what the switch shows, so keep it
# short enough to sit on one line.

- id: full
  label: "Full"
  text: >-
    Dr. sc. Sandi Baressi Šegota, univ. mag. ing. comp., is an Assistant Professor at the
    [Faculty of Informatics, Juraj Dobrila University of Pula](https://fipu.unipu.hr), where his
    research predominantly focuses on Artificial Intelligence and Machine Learning. He earned his
    Doctorate of Science in Electrical Engineering in 2025. After completing Secondary Technical
    School Pula in 2013 and obtaining the qualification of Electrical Technician, he graduated from
    the Faculty of Engineering, University of Rijeka, with a bachelor's degree (*cum laude*) in
    Computer Science in 2017 and a master's degree (*cum laude*) in the same field in 2019. He
    enrolled in doctoral studies at the Faculty of Engineering in Rijeka later that year.


    During his studies, he was an active member of the academic community, serving on the Student
    Council of the Faculty of Engineering and as the representative of doctoral students from 2020
    to 2022. He began his professional career at the [University of Rijeka](https://uniri.hr/) in
    2019 as a junior researcher and expert associate, working on the CEKOM SmartCity.4DII
    (KK.01.2.2.03.0004) and the Scientific Center of Research Excellence in Data Science
    "DATACROSS" (KK.01.1.1.01.0009).


    In the private sector, he serves as a Lead Developer at
    [dAIgnostics LLC](https://daignostics.info), which focuses on groundbreaking research in health
    informatics and early neurodegenerative diagnostics. He also coordinates the architectural
    strategy and software implementation for the skincare mobile platform startup
    ["LiberiqAI"](https://liberiq.com), exploring agentic structures. He frequently engages in joint
    academic outreach, delivering lectures at various events.


    Throughout his academic career, Dr. Baressi Šegota has coauthored over 50 papers indexed in the
    Web of Science Core Collection, 30% of which he authored as the first author. He has also
    coauthored over 25 conference papers, 6 extended abstracts, and 1 book chapter. According to
    Google Scholar, his publications have been cited more than 1,000 times in total. His scientific
    and professional achievements have been recognized with several awards, including the 2021 Award
    for Exceptional Contribution to the Development and Promotion of Technical Culture by the
    Community of Technical Culture Pula and the Best Paper Award in the field of Artificial
    Intelligence in Medical Science at the SICAAI conference in 2023.


    Beyond his academic and research activities, Dr. Baressi Šegota is an active member of the
    Astronomical Society "Istra" Pula (ADIP), which he joined in 2008. He has served as a member of
    the directorate since 2021 and as General Secretary since 2025. He serves as a representative in
    multiple bodies, including the Croatian Astronomical Union and the Community of Technical
    Culture, and volunteers for projects such as STEM Games and Istra-STEM. He has also been a
    member of the Institute of Electrical and Electronics Engineers (IEEE) since 2021 and of the
    Global Meteor Network (GMN) since its inception.

