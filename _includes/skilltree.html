<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@1,400;1,500&display=swap">

<style>
.sky {
  --void:   #070b18;
  --deep:   #0d1428;
  --grid:   #1b2747;
  --star:   #eef3ff;
  --dim:    #7d90bd;
  --faint:  #4c5c85;
  --edge:   #223257;

  --sp-O: #8ea6ff;  --sp-B: #a9c0ff;  --sp-A: #dfe8ff;  --sp-F: #fff3d6;
  --sp-G: #ffd98a;  --sp-K: #ffb066;  --sp-M: #ff8a7a;
  --sp-N1:#66e0d0;  --sp-N2:#ff8ad4;  --sp-N3:#b08cff;

  position: relative;
  margin: 1.5em 0 2.5em;
  background: radial-gradient(120% 90% at 22% 8%, #14203c 0%, var(--void) 62%);
  border: 1px solid var(--edge);
  color: var(--star);
  font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
  font-size: 16px;
  line-height: 1.45;
  overflow: hidden;
}

/* ---- header ---------------------------------------------------------- */
.sky__head {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 1.4rem;
  padding: 1.1rem 1.3rem .9rem;
  border-bottom: 1px solid var(--edge);
}
.sky__title {
  font-family: Spectral, Georgia, serif; font-style: italic; font-weight: 500;
  font-size: 1.35rem; letter-spacing: .01em; margin: 0; color: var(--star);
}
.sky__sub { color: var(--dim); font-size: .95rem; max-width: 46ch; margin: 0; }
.sky__stats {
  margin-left: auto; font-family: "IBM Plex Mono", monospace;
  font-size: .72rem; color: var(--faint); letter-spacing: .04em;
  text-align: right; white-space: nowrap;
}

/* ---- magnitude legend ------------------------------------------------ */
.sky__legend {
  display: flex; flex-wrap: wrap; gap: .35rem 1.15rem; align-items: center;
  padding: .6rem 1.3rem; border-bottom: 1px solid var(--edge);
  font-family: "IBM Plex Mono", monospace; font-size: .68rem;
  letter-spacing: .06em; text-transform: uppercase; color: var(--faint);
}
.sky__legend b { color: var(--dim); font-weight: 500; }
.sky__mag { display: inline-flex; align-items: center; gap: .38rem; }
.sky__mag i { display: block; border-radius: 50%; background: var(--sp-A); }

/* ---- layout ---------------------------------------------------------- */
.sky__body { display: grid; grid-template-columns: 1fr 20rem; }
.sky__chart { position: relative; min-width: 0; }
.sky__chart svg { display: block; width: 100%; height: auto; }

/* ---- chart marks ----------------------------------------------------- */
.sky-grid    { stroke: var(--grid); stroke-width: .5; fill: none; }
.sky-dust    { fill: var(--faint); }
.sky-link    { stroke: var(--edge); stroke-width: 1; fill: none;
               stroke-linecap: round; }
.sky-cell    { fill: transparent; }
.sky-cname   { font-family: Spectral, Georgia, serif; font-style: italic;
               fill: var(--dim); font-size: 13px; }
.sky-ccount  { font-family: "IBM Plex Mono", monospace; fill: var(--faint);
               font-size: 8.5px; letter-spacing: .08em; }
.sky-label   { font-family: "Barlow Condensed", sans-serif; fill: var(--dim);
               font-size: 10.5px; letter-spacing: .05em; pointer-events: none; }
.sky-spike   { stroke-width: .8; opacity: .55; }

.sky-star { cursor: pointer; outline: none; }
.sky-star .halo { opacity: .16; }
.sky-star:hover .sky-label,
.sky-star:focus-visible .sky-label { fill: var(--star); }
.sky-star:focus-visible .ring { opacity: 1; }
.sky-star .ring { fill: none; stroke: var(--star); stroke-width: 1;
                  opacity: 0; transition: opacity .15s; }
.sky-star[aria-pressed="true"] .ring { opacity: .9; }
.sky-star:hover .ring { opacity: .45; }

/* ---- detail panel ---------------------------------------------------- */
.sky__panel {
  border-left: 1px solid var(--edge); padding: 1.15rem 1.25rem;
  background: rgba(3, 7, 18, .5); min-width: 0;
}
.sky__eyebrow {
  font-family: "IBM Plex Mono", monospace; font-size: .66rem;
  letter-spacing: .16em; text-transform: uppercase; color: var(--faint);
  display: block; margin-bottom: .45rem;
}
.sky__name {
  font-family: Spectral, Georgia, serif; font-style: italic; font-weight: 500;
  font-size: 1.2rem; margin: 0 0 .15rem; color: var(--star);
}
.sky__note { color: var(--dim); font-size: .95rem; margin: .35rem 0 .9rem; }
.sky__bar { display: flex; gap: 3px; margin: .5rem 0 .2rem; }
.sky__bar span { height: 5px; flex: 1; background: var(--edge); }
.sky__bar span.on { background: currentColor; }
.sky__rank {
  font-family: "IBM Plex Mono", monospace; font-size: .7rem; color: var(--dim);
  letter-spacing: .08em; text-transform: uppercase;
}
.sky__counts {
  display: flex; gap: 1.1rem; margin: .9rem 0 1rem; padding: .6rem 0;
  border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
  font-family: "IBM Plex Mono", monospace;
}
.sky__counts div { line-height: 1.25; }
.sky__counts b { display: block; font-size: 1.15rem; font-weight: 500;
                 color: var(--star); }
.sky__counts small { font-size: .62rem; letter-spacing: .1em;
                     text-transform: uppercase; color: var(--faint); }
.sky__list { list-style: none; margin: 0 0 1rem; padding: 0; }
.sky__list li { margin: 0 0 .55rem; font-size: .88rem; line-height: 1.35; }
.sky__list a { color: var(--star); text-decoration: none;
               border-bottom: 1px solid var(--faint); }
.sky__list a:hover { border-bottom-color: var(--star); }
.sky__list em { display: block; font-style: normal; color: var(--faint);
                font-family: "IBM Plex Mono", monospace; font-size: .66rem;
                letter-spacing: .06em; margin-top: .1rem; }
.sky__foot {
  padding: .7rem 1.3rem; border-top: 1px solid var(--edge);
  font-family: "IBM Plex Mono", monospace; font-size: .66rem;
  color: var(--faint); letter-spacing: .04em;
}
.sky__foot a { color: var(--dim); }

@media (max-width: 800px) {
  .sky__body { grid-template-columns: 1fr; }
  .sky__panel { border-left: 0; border-top: 1px solid var(--edge); }
  .sky__stats { margin-left: 0; text-align: left; }
}

/* ---- entrance -------------------------------------------------------- */
@keyframes sky-rise { from { opacity: 0; transform: scale(.4); }
                      to   { opacity: 1; transform: scale(1); } }
@keyframes sky-draw { to { stroke-dashoffset: 0; } }
.sky--anim .sky-star { animation: sky-rise .5s ease-out backwards;
                       transform-origin: center; transform-box: fill-box; }
.sky--anim .sky-link { stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
                       animation: sky-draw 1.1s ease-out .35s forwards; }
@media (prefers-reduced-motion: reduce) {
  .sky--anim .sky-star, .sky--anim .sky-link { animation: none; }
  .sky--anim .sky-link { stroke-dashoffset: 0; }
}
</style>

<div class="sky" id="sky">
  <div class="sky__head">
    <div>
      <p class="sky__title">A chart of what I actually work on</p>
      <p class="sky__sub">Every star is a skill. Its brightness is the weight of
        published papers and public code behind it &mdash; nothing here is
        self-assessed. Pick one to read the evidence.</p>
    </div>
    <div class="sky__stats" id="sky-stats"></div>
  </div>

  <div class="sky__legend" id="sky-legend"><b>Magnitude</b></div>

  <div class="sky__body">
    <div class="sky__chart" id="sky-chart"></div>
    <aside class="sky__panel" id="sky-panel" aria-live="polite"></aside>
  </div>

  <div class="sky__foot" id="sky-foot"></div>
</div>

<script id="skilltree-data" type="application/json">{{ site.data.skilltree | jsonify }}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("skilltree-data").textContent);
  var root  = document.getElementById("sky");
  var chart = document.getElementById("sky-chart");
  var panel = document.getElementById("sky-panel");
  var NS = "http://www.w3.org/2000/svg";
  var selected = null;

  function el(name, attrs, parent) {
    var node = document.createElementNS(NS, name);
    for (var key in attrs) { node.setAttribute(key, attrs[key]); }
    if (parent) { parent.appendChild(node); }
    return node;
  }
  function esc(text) {
    return String(text == null ? "" : text).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  /* Deterministic jitter: the chart must look identical on every build. */
  function seeded(text) {
    var h = 2166136261;
    for (var i = 0; i < text.length; i++) {
      h ^= text.charCodeAt(i); h = Math.imul(h, 16777619);
    }
    return function () {
      h ^= h << 13; h ^= h >>> 17; h ^= h << 5;
      return ((h >>> 0) % 100000) / 100000;
    };
  }
  function hue(spectral) { return "var(--sp-" + (spectral || "A") + ")"; }
  function radius(level) { return 2.4 + level * 1.45; }

  /* ---- header, legend, footer ---------------------------------------- */
  var src = DATA.sources || {};
  document.getElementById("sky-stats").innerHTML =
    esc(src.papers) + " papers &middot; " + esc(src.repos) + " repositories<br>" +
    esc(src.citations) + " citations &middot; h-index " + esc(src.h_index);

  var legend = document.getElementById("sky-legend");
  DATA.levels.forEach(function (label, index) {
    var item = document.createElement("span");
    item.className = "sky__mag";
    var size = radius(index + 1) * 1.55;
    item.innerHTML = '<i style="width:' + size + "px;height:" + size + 'px"></i>' +
                     esc(label);
    legend.appendChild(item);
  });

  document.getElementById("sky-foot").innerHTML =
    "Rebuilt " + esc(DATA.generated) +
    " from Google Scholar and the GitHub API &middot; " +
    '<a href="https://github.com/' + "ssegota/ssegota.github.io" +
    '/blob/master/_data/skills.yml">taxonomy</a>';

  /* ---- layout --------------------------------------------------------- */
  function columnsFor(width) {
    if (width >= 1000) { return 5; }
    if (width >= 700)  { return 3; }
    if (width >= 460)  { return 2; }
    return 1;
  }

  function place(constellation, cellW, cellH) {
    /* Scatter stars inside the cell, keeping them apart, brightest first. */
    var pad = 26, top = 20, bottom = 40;
    var stars = constellation.skills.slice();
    var rand = seeded(constellation.id);
    var placed = [];

    stars.forEach(function (skill) {
      var r = radius(skill.level), best = null, bestGap = -1;
      for (var attempt = 0; attempt < 90; attempt++) {
        var x = pad + rand() * (cellW - pad * 2);
        var y = top + rand() * (cellH - top - bottom);
        var gap = Infinity;
        for (var i = 0; i < placed.length; i++) {
          var dx = placed[i].x - x, dy = placed[i].y - y;
          gap = Math.min(gap, Math.sqrt(dx * dx + dy * dy) - placed[i].r - r);
        }
        if (gap > 34) { best = { x: x, y: y }; break; }
        if (gap > bestGap) { bestGap = gap; best = { x: x, y: y }; }
      }
      placed.push({ x: best.x, y: best.y, r: r, skill: skill });
    });
    return placed;
  }

  function chain(points) {
    /* Nearest-neighbour walk from the brightest star, like a real asterism. */
    if (points.length < 2) { return []; }
    var left = points.slice(1), current = points[0], path = [];
    while (left.length) {
      var nearest = 0, best = Infinity;
      for (var i = 0; i < left.length; i++) {
        var dx = left[i].x - current.x, dy = left[i].y - current.y;
        var d = dx * dx + dy * dy;
        if (d < best) { best = d; nearest = i; }
      }
      path.push([current, left[nearest]]);
      current = left.splice(nearest, 1)[0];
    }
    return path;
  }

  function render() {
    var cols = columnsFor(chart.clientWidth || 900);
    var groups = DATA.constellations;
    var rows = Math.ceil(groups.length / cols);
    var cellW = 200, cellH = 290;
    var W = cols * cellW, H = rows * cellH;

    chart.innerHTML = "";
    var svg = el("svg", {
      viewBox: "0 0 " + W + " " + H, role: "group",
      "aria-label": "Skill star chart"
    }, chart);

    /* faint coordinate grid, the way a printed chart is ruled */
    var grid = el("g", { class: "sky-grid" }, svg);
    for (var gx = cellW / 2; gx < W; gx += cellW / 2) {
      el("line", { x1: gx, y1: 0, x2: gx, y2: H }, grid);
    }
    for (var gy = cellH / 2; gy < H; gy += cellH / 2) {
      el("line", { x1: 0, y1: gy, x2: W, y2: gy }, grid);
    }

    /* background dust so the field is not empty black */
    var dustRand = seeded("dust"), dust = el("g", { class: "sky-dust" }, svg);
    for (var d = 0; d < Math.round(W * H / 2200); d++) {
      el("circle", {
        cx: (dustRand() * W).toFixed(1), cy: (dustRand() * H).toFixed(1),
        r: (0.3 + dustRand() * 0.7).toFixed(2),
        opacity: (0.15 + dustRand() * 0.4).toFixed(2)
      }, dust);
    }

    var order = 0;
    groups.forEach(function (group, index) {
      var ox = (index % cols) * cellW, oy = Math.floor(index / cols) * cellH;
      var cell = el("g", { transform: "translate(" + ox + "," + oy + ")" }, svg);
      var color = hue(group.spectral);
      var points = place(group, cellW, cellH);

      chain(points).forEach(function (pair) {
        var dx = pair[1].x - pair[0].x, dy = pair[1].y - pair[0].y;
        var len = Math.sqrt(dx * dx + dy * dy).toFixed(1);
        var line = el("line", {
          class: "sky-link", x1: pair[0].x, y1: pair[0].y,
          x2: pair[1].x, y2: pair[1].y
        }, cell);
        line.style.setProperty("--len", len);
      });

      points.forEach(function (point) {
        var skill = point.skill;
        var star = el("g", {
          class: "sky-star", tabindex: "0", role: "button",
          "aria-pressed": "false", "data-id": skill.id,
          "aria-label": skill.name + ", level " + skill.level + " of 5"
        }, cell);
        star.style.animationDelay = (order++ * 22) + "ms";
        star.style.color = color;

        el("circle", { class: "halo", cx: point.x, cy: point.y,
                       r: point.r * 3.1, fill: color }, star);
        if (skill.level >= 4) {
          var s = point.r * 3.4;
          el("path", {
            class: "sky-spike", stroke: color,
            d: "M" + (point.x - s) + " " + point.y + "H" + (point.x + s) +
               "M" + point.x + " " + (point.y - s) + "V" + (point.y + s)
          }, star);
        }
        el("circle", { cx: point.x, cy: point.y, r: point.r, fill: color }, star);
        el("circle", { class: "ring", cx: point.x, cy: point.y,
                       r: point.r + 5 }, star);

        /* Labels must stay inside their own cell, so try right, then left,
           then centred underneath the star. */
        var width = skill.name.length * 4.55;
        var gap = point.r + 6, label;
        if (point.x + gap + width < cellW - 6) {
          label = { x: point.x + gap, y: point.y + 3.6, anchor: "start" };
        } else if (point.x - gap - width > 6) {
          label = { x: point.x - gap, y: point.y + 3.6, anchor: "end" };
        } else {
          label = { x: Math.min(Math.max(point.x, width / 2 + 6), cellW - width / 2 - 6),
                    y: point.y + point.r + 13, anchor: "middle" };
        }
        el("text", { class: "sky-label", x: label.x.toFixed(1),
                     y: label.y.toFixed(1), "text-anchor": label.anchor }, star)
          .textContent = skill.name;

        star.addEventListener("click", function () { select(group, skill, star); });
        star.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault(); select(group, skill, star);
          }
        });
      });

      el("text", { class: "sky-cname", x: 16, y: cellH - 22 }, cell)
        .textContent = group.name;
      el("text", { class: "sky-ccount", x: 16, y: cellH - 10 }, cell)
        .textContent = group.skills.length + " SKILLS \u00B7 PEAK " +
                       DATA.levels[group.peak - 1].toUpperCase();
    });

    root.classList.add("sky--anim");
    if (selected) { restore(); } else { intro(); }
  }

  /* ---- panel ---------------------------------------------------------- */
  function intro() {
    var top = DATA.constellations
      .map(function (c) { return c.skills[0]; })
      .sort(function (a, b) { return b.score - a.score; })
      .slice(0, 3);
    panel.innerHTML =
      '<span class="sky__eyebrow">How to read this</span>' +
      '<p class="sky__note">Ten constellations, one per research area. A star' +
      ' grows brighter the more papers and repositories match it, so the chart' +
      ' shifts on its own as new work lands.</p>' +
      '<p class="sky__note">Brightest right now: ' +
      top.map(function (s) { return "<b>" + esc(s.name) + "</b>"; }).join(", ") +
      ".</p>";
  }

  function restore() {
    var star = chart.querySelector('[data-id="' + selected + '"]');
    if (star) { star.setAttribute("aria-pressed", "true"); }
  }

  function select(group, skill, node) {
    chart.querySelectorAll(".sky-star").forEach(function (s) {
      s.setAttribute("aria-pressed", "false");
    });
    node.setAttribute("aria-pressed", "true");
    selected = skill.id;

    var bars = "";
    for (var i = 1; i <= 5; i++) {
      bars += '<span class="' + (i <= skill.level ? "on" : "") + '"></span>';
    }

    var papers = skill.evidence.papers.map(function (p) {
      return "<li><a href=" + JSON.stringify(p.url) + ' rel="noopener">' +
        esc(p.title) + "</a><em>" + esc(p.year) +
        (p.citations ? " \u00B7 " + p.citations + " CITATIONS" : "") +
        "</em></li>";
    }).join("");

    var repos = skill.evidence.repos.map(function (r) {
      return "<li><a href=" + JSON.stringify(r.url) + ' rel="noopener">' +
        esc(r.name) + "</a><em>" + esc(r.language || "\u2014") + "</em></li>";
    }).join("");

    panel.innerHTML =
      '<span class="sky__eyebrow">' + esc(group.name) + "</span>" +
      '<h3 class="sky__name">' + esc(skill.name) + "</h3>" +
      '<div style="color:' + hue(group.spectral) + '">' +
      '<div class="sky__bar">' + bars + "</div></div>" +
      '<span class="sky__rank">' + esc(DATA.levels[skill.level - 1]) + "</span>" +
      (skill.note ? '<p class="sky__note">' + esc(skill.note) + "</p>" : "") +
      '<div class="sky__counts">' +
        "<div><b>" + skill.papers + "</b><small>Papers</small></div>" +
        "<div><b>" + skill.repos + "</b><small>Repos</small></div>" +
        "<div><b>" + skill.citations + "</b><small>Citations</small></div>" +
      "</div>" +
      (papers ? '<span class="sky__eyebrow">Published work</span><ul class="sky__list">' +
        papers + "</ul>" : "") +
      (repos ? '<span class="sky__eyebrow">Code</span><ul class="sky__list">' +
        repos + "</ul>" : "");
  }

  /* ---- go ------------------------------------------------------------- */
  render();
  var timer;
  window.addEventListener("resize", function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      root.classList.remove("sky--anim");
      render();
    }, 180);
  });
}());
</script>
